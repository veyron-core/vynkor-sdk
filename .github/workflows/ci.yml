name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # dependency-direction guard (§8): the SDK depends on vynkor-wire only —
      # an inverted tree on the frozen old crate must stay empty.
      - name: No old wire dependency
        run: |
          cargo tree -i veyron-wire > /dev/null 2>&1 && {
            echo "FAIL: vynkor-sdk depends on the deprecated veyron-wire crate"
            exit 1
          } || echo "ok: no veyron-wire dependency"

      - name: Build
        run: cargo build

      - name: Tests
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check
